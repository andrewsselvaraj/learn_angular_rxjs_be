apiVersion: v1
kind: ConfigMap
metadata:
  name: learn-angular-rxjs-be-config
data:
  PORT: "8080"
  # Origins allowed for REST and the leaderboard WebSocket. Add the deployed Angular app's URL (comma separated).
  CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://127.0.0.1:4200"
  SERVER_SHUTDOWN: "graceful"
  # Turns on /actuator/health/liveness and /readiness used by the probes.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  JAVA_MAX_RAM_RATIO: "75"
