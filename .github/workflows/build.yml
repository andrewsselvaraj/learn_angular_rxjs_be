name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B package
      - uses: actions/upload-artifact@v4
        with:
          name: learn-angular-rxjs-be-jar
          path: target/*.jar
      - name: Build Docker image
        run: docker build -t learn-angular-rxjs-be .
