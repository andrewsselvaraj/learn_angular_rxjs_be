apiVersion: apps/v1
kind: Deployment
metadata:
  name: learn-angular-rxjs-be
  annotations:
    # Roll out automatically whenever a build pushes a new learn-angular-rxjs-be:latest.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"learn-angular-rxjs-be:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"learn-angular-rxjs-be\")].image"}]
spec:
  # Keep 2 old ReplicaSets for rollback; the Developer Sandbox allows 30 per project.
  revisionHistoryLimit: 2
  # Exams, answers and the leaderboard live in memory, so run exactly one copy
  # and replace it rather than running old and new side by side.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: learn-angular-rxjs-be
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learn-angular-rxjs-be
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: learn-angular-rxjs-be
          image: learn-angular-rxjs-be:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: learn-angular-rxjs-be-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Spring Boot exposes these health groups when probes are enabled (see the ConfigMap).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
