# OpenShift resources for the mock exam backend.
# Apply with: oc apply -f openshift/app.yaml   then   oc start-build learn-angular-rxjs-be --follow
apiVersion: v1
kind: List
items:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: learn-angular-rxjs-be
      labels:
        app: learn-angular-rxjs-be

  # Builds the image in the cluster from the Dockerfile in this repo.
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: learn-angular-rxjs-be
      labels:
        app: learn-angular-rxjs-be
    spec:
      source:
        type: Git
        git:
          uri: https://github.com/andrewsselvaraj/learn_angular_rxjs_be.git
          ref: main
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile
      output:
        to:
          kind: ImageStreamTag
          name: learn-angular-rxjs-be:latest
      triggers:
        - type: ConfigChange

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: learn-angular-rxjs-be
      labels:
        app: learn-angular-rxjs-be
      annotations:
        # Roll out again whenever a new image lands in the ImageStream.
        image.openshift.io/triggers: >-
          [{"from":{"kind":"ImageStreamTag","name":"learn-angular-rxjs-be:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]
    spec:
      # All exam data is in memory, so keep a single replica.
      replicas: 1
      selector:
        matchLabels:
          app: learn-angular-rxjs-be
      template:
        metadata:
          labels:
            app: learn-angular-rxjs-be
        spec:
          containers:
            - name: app
              image: learn-angular-rxjs-be:latest
              ports:
                - containerPort: 8080
              env:
                - name: PORT
                  value: "8080"
                # Add the deployed Angular app's URL, comma separated with any others.
                - name: CORS_ALLOWED_ORIGINS
                  value: http://localhost:4200,http://127.0.0.1:4200
              resources:
                requests:
                  cpu: 100m
                  memory: 384Mi
                limits:
                  memory: 768Mi
              readinessProbe:
                httpGet:
                  path: /api/health/ping
                  port: 8080
                initialDelaySeconds: 10
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /api/health/ping
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 20

  - apiVersion: v1
    kind: Service
    metadata:
      name: learn-angular-rxjs-be
      labels:
        app: learn-angular-rxjs-be
    spec:
      selector:
        app: learn-angular-rxjs-be
      ports:
        - name: http
          port: 8080
          targetPort: 8080

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: learn-angular-rxjs-be
      labels:
        app: learn-angular-rxjs-be
      annotations:
        # Keep the leaderboard WebSocket open longer than the router's default 30s idle timeout.
        haproxy.router.openshift.io/timeout: 1h
    spec:
      to:
        kind: Service
        name: learn-angular-rxjs-be
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
