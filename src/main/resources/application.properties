spring.application.name=learn-angular-rxjs-be
# Hosts like Render and Railway pass the port in $PORT.
server.port=${PORT:8080}

# Origins allowed to call the API and open the WebSocket (Angular dev server by default)
# Set CORS_ALLOWED_ORIGINS on the host to add the deployed frontend URL (comma separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Mock classmates start and submit on their own so the leaderboard changes while you watch.
app.simulation.enabled=true
app.simulation.classmate-submit-interval-ms=15000

# Artificial delay (ms) on POST /submit, so a double click lands while the first request is still in flight.
app.simulation.submit-delay-ms=1500

# Exam length. Lower it (e.g. 360) to reach the "5 minutes left" warning and the auto-submit quickly.
app.exam.duration-seconds=1800

# Saves are still accepted this many seconds after the timer ends (covers clock drift and the final auto-save).
app.exam.grace-seconds=30
